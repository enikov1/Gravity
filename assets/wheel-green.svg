<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="tireG" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#1c1f1c"/>
      <stop offset="100%" stop-color="#30352d"/>
    </radialGradient>
    <radialGradient id="hubG" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c9cfc9"/>
      <stop offset="100%" stop-color="#5a6159"/>
    </radialGradient>
  </defs>
  <!-- Outer tire -->
  <circle cx="64" cy="64" r="58" fill="url(#tireG)" stroke="#30352d" stroke-width="2"/>
  <!-- Tire knobs pattern -->
  <g fill="#30352d" opacity="0.7">
    <circle cx="64" cy="12" r="3"/>
    <circle cx="97" cy="22" r="3"/>
    <circle cx="116" cy="50" r="3"/>
    <circle cx="116" cy="78" r="3"/>
    <circle cx="97" cy="106" r="3"/>
    <circle cx="64" cy="116" r="3"/>
    <circle cx="31" cy="106" r="3"/>
    <circle cx="12" cy="78" r="3"/>
    <circle cx="12" cy="50" r="3"/>
    <circle cx="31" cy="22" r="3"/>
  </g>
  <!-- Green rim accent -->
  <circle cx="64" cy="64" r="44" fill="none" stroke="#7d8a4f" stroke-width="5"/>
  <!-- Inner rim -->
  <circle cx="64" cy="64" r="38" fill="none" stroke="#c9cfc9" stroke-width="2"/>
  <!-- Spokes -->
  <g stroke="#e2e7e0" stroke-width="2.5" opacity="0.9">
    <line x1="64" y1="30" x2="64" y2="98"/>
    <line x1="30" y1="64" x2="98" y2="64"/>
    <line x1="40" y1="40" x2="88" y2="88"/>
    <line x1="88" y1="40" x2="40" y2="88"/>
    <line x1="50" y1="30" x2="78" y2="98"/>
    <line x1="30" y1="50" x2="98" y2="78"/>
  </g>
  <!-- Hub -->
  <circle cx="64" cy="64" r="14" fill="url(#hubG)" stroke="#3c4232" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="6" fill="#cdd3cd"/>
</svg>
